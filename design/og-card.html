<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:TDisplay;src:url(../assets/thmanyahserifdisplay-Bold.woff2)}
@font-face{font-family:TSans;src:url(../assets/thmanyahsans-Medium.woff2)}
@font-face{font-family:TSans;font-weight:700;src:url(../assets/thmanyahsans-Bold.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:TSans;color:#123d45;
 background:radial-gradient(ellipse 70% 90% at 18% 55%,#ffffff 0,#e3f2ee 45%,transparent 70%),linear-gradient(120deg,#d7eddf,#a9d1d0)}
.card{position:relative;width:100%;height:100%;padding:64px 72px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:92px}
.brand h1{font-family:TDisplay;font-size:92px;line-height:1}
.brand small{display:block;font-size:30px;color:#087577;font-weight:700;letter-spacing:.5px}
.lead{margin-top:34px;font-family:TDisplay;font-size:50px;line-height:1.3;margin-right:0;max-width:600px}
.tag{margin-top:16px;font-size:28px;color:#537579}
.steps{position:absolute;bottom:58px;right:72px;display:flex;gap:12px}
.steps span{background:#123d45;color:#fff;font-weight:700;font-size:24px;padding:10px 22px;border-radius:40px}
.steps span:last-child{background:#d5a647;color:#123d45}
.device{position:absolute;left:10px;top:120px;width:530px;filter:drop-shadow(0 30px 40px #123d4533)}
.ring{position:absolute;left:40px;top:60px;width:540px;height:540px;border-radius:50%;border:2px solid #08757722}
.scan{position:absolute;left:110px;top:200px;width:390px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#e78d29,#d5a647,transparent);box-shadow:0 0 30px #e78d29aa}
</style></head><body><div class="card">
<div class="ring"></div><img class="device" src="../assets/device.webp"><div class="scan"></div>
<div class="brand"><img src="../assets/logo.webp"><h1>خطاك<small>STEPS · FootGuard</small></h1></div>
<p class="lead">محطة فحص وقائي ذكية<br>للقدم قبل الإصابة</p>
<p class="tag">نكتشف الخطر قبل أن يصبح إصابة</p>
<div class="steps"><span>نفحص</span><span>نكتشف</span><span>نحمي</span><span>نوجّه</span></div>
</div></body></html>
