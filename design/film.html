<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>STEPS pitch film</title>
<style>
@font-face{font-family:TDisplay;src:url(../assets/thmanyahserifdisplay-Bold.woff2);font-weight:700}
@font-face{font-family:TSans;src:url(../assets/thmanyahsans-Bold.woff2);font-weight:700}
@font-face{font-family:TSansR;src:url(../assets/thmanyahsans-Medium.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#123d45;color:#fff}
iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;opacity:0}
.cap{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);max-width:1500px;padding:18px 40px;border-radius:60px;background:#0f2f36e6;
  font-family:TDisplay;font-size:46px;line-height:1.35;text-align:center;box-shadow:0 20px 50px -20px #000a;opacity:0}
.cap b{color:#ffd166;font-weight:700}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at 50% 40%,#e9f5ef 0,#bfdcd8 70%);color:#123d45;opacity:0}
.card img.logo{width:150px}
.card h1{font-family:TDisplay;font-size:170px;line-height:1}
.card h1 small{display:block;font-family:TSans;font-size:44px;color:#087577;text-align:center;margin-top:10px}
.card p{font-family:TDisplay;font-size:56px}
.card .chips{display:flex;gap:16px;font-family:TSans;font-size:36px}
.card .chips span{background:#123d45;color:#fff;padding:10px 30px;border-radius:40px}
.card .chips span:last-child{background:#d5a647;color:#123d45}
.links{display:flex;gap:60px;margin-top:20px}
.links div{display:flex;flex-direction:column;align-items:center;gap:12px;font-family:TSans;font-size:30px}
.links img{width:210px;height:210px;background:#fff;padding:12px;border-radius:18px}
.wipe{position:absolute;inset:0;background:#123d45;opacity:0;pointer-events:none}
</style></head><body>
<iframe id="site" src="../index.html?lang=ar#1"></iframe>
<div class="card" id="intro"><img class="logo" src="../assets/logo.webp" alt=""><h1>خطاك<small>STEPS · FootGuard</small></h1><p>نكتشف الخطر قبل أن يصبح إصابة</p></div>
<div class="card" id="outro"><h1 style="font-size:120px">جرّب المشروع</h1>
  <div class="links"><div><img src="qr-site.png" alt="">العرض التفاعلي</div><div><img src="qr-app.png" alt="">النموذج الأولي</div><div><img src="qr-3d.png" alt="">عارض الجهاز 3D</div></div>
  <div class="chips"><span>نفحص</span><span>نكتشف</span><span>نحمي</span><span>نوجّه</span></div></div>
<div class="cap" id="cap"></div>
<div class="wipe" id="wipe"></div>
<script src="../assets/vendor/gsap.min.js"></script>
<script>
// Shot list: [site scene, seconds, caption]. The site's own motion plays inside each shot.
const shots = [
  [4, 7, 'الحاج يمشي <b>أكثر من 60 كم</b> على أسطح تصل حرارتها إلى <b><bdi dir="ltr">70°C</bdi></b>'],
  [7, 7, 'واليوم نتعامل مع إصابات القدم <b>بعد</b> أن تحدث'],
  [1, 11, '<b>خطاك</b>: محطة تفحص القدم <b>قبل</b> الإصابة — بصري، حراري، ضغط'],
  [5, 7, 'فرق حراري <b>أكثر من <bdi dir="ltr">2.2°C</bdi></b> بين القدمين إنذار مبكر بخطر التقرّح'],
  [8, 7, 'تُدمج القراءات مع <b>الأسئلة الصحية</b> و<b>الفحص السريري</b>'],
  [16, 7, 'والنتيجة <b>فئة إجراء واضحة</b>، وإحالة للمختص عند الحاجة'],
  [13, 7, 'لا يجمع أي بديل حالي هذا كله في <b>محطة مصممة للحج</b>'],
  [19, 6, '<b>نحو 1.71 مليون</b> حاج في موسم واحد'],
  [2, 6, 'فريق يجمع <b>الطب</b> و<b>الصحة العامة</b> و<b>التقنية</b>'],
];
const frame = document.getElementById('site'), cap = document.getElementById('cap'), wipe = document.getElementById('wipe');
frame.addEventListener('load', () => {
  const d = frame.contentDocument;
  const st = d.createElement('style');   // film framing: only the stage, full frame
  st.textContent = '.toolbar,.transport{display:none!important}#viewport{height:100vh!important;padding:0!important}body{background:#dcecea!important}';
  d.head.append(st);
  frame.contentWindow.dispatchEvent(new Event('resize'));
  setTimeout(run, 600);
}, { once: true });
const go = n => () => { frame.contentWindow.location.hash = '#' + n; };
function run() {
  const tl = gsap.timeline({ onComplete: () => { window.__filmDone = true; } });
  tl.to('#intro', { opacity: 1, duration: 0.6 })
    .from('#intro h1', { y: 40, opacity: 0, duration: 0.8, ease: 'power3.out' }, '<')
    .from('#intro p', { y: 20, opacity: 0, duration: 0.6 }, '-=0.3')
    .to({}, { duration: 2.2 });
  shots.forEach(([n, secs, text], i) => {
    tl.to(wipe, { opacity: 1, duration: 0.35 })
      .call(go(n))
      .set(i === 0 ? '#intro' : {}, i === 0 ? { opacity: 0 } : {})
      .set(frame, { opacity: 1 })
      .set(cap, { innerHTML: text })
      .to(wipe, { opacity: 0, duration: 0.45 }, '+=0.35')
      .fromTo(cap, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, '-=0.1')
      .to({}, { duration: secs - 1.2 })
      .to(cap, { opacity: 0, duration: 0.3 });
  });
  tl.to(wipe, { opacity: 1, duration: 0.35 })
    .set('#outro', { opacity: 1 }).set(frame, { opacity: 0 })
    .to(wipe, { opacity: 0, duration: 0.5 })
    .from('#outro .links > div', { y: 30, opacity: 0, stagger: 0.15, duration: 0.6 }, '<')
    .to({}, { duration: 5 });
}
</script>
</body></html>
